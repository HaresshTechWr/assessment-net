name: Docs Quality Checks

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  lint-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: "docs/**/*.md"

      - name: Run markdownlint
        if: steps.changed-files.outputs.any_changed == 'true'
        id: lint
        continue-on-error: true
        run: |
          npx markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }} \
            2>&1 | tee lint-output.txt
          echo "exit_code=${PIPESTATUS[0]}" >> $GITHUB_OUTPUT

      - name: Post lint results as PR comment
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('lint-output.txt', 'utf8').trim();
            } catch(e) {
              output = 'Could not read lint output.';
            }
            const hasErrors = output.includes('Error:') || output.includes('error');
            const icon = hasErrors ? '⚠️' : '✅';
            const title = hasErrors
              ? '**Markdown lint warnings found** — pipeline not blocked, but please review before merging.'
              : '**Markdown lint passed** — no issues found.';
            const body = `${icon} ${title}\n\n${hasErrors ? '```\n' + output + '\n```' : ''}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  check-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check for broken links
        id: links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --base ./build --offline --output ./lychee-output.md ./build/**/*.html
          fail: false

      - name: Post broken link results as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('lychee-output.md', 'utf8').trim();
            } catch(e) {
              output = 'Could not read link check output.';
            }
            const hasBroken = output.includes('Error') || output.includes('Failed');
            const icon = hasBroken ? '⚠️' : '✅';
            const title = hasBroken
              ? '**Broken links found** — pipeline not blocked, but please fix before merging.'
              : '**No broken links found.**';
            const body = `${icon} ${title}\n\n${hasBroken ? output : ''}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            })

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Serve built site
        run: npx serve build -l 3000 &

      - name: Wait for server
        run: sleep 5

      - name: Run pa11y accessibility checks
        run: |
          pa11y-ci \
            http://localhost:3000/docs/getting-started/introduction \
            http://localhost:3000/docs/api-reference/overview \
            http://localhost:3000/docs/sdk/overview \
            --reporter json > pa11y-report.json
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-report
          path: pa11y-report.json