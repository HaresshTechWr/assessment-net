name: Docs Quality Checks

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
          mv build-output.txt build/build-output.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: build/
          retention-days: 1

  docs-quality:
    name: Docs Quality
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: build/

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: "docs/**/*.md"

      - name: Run markdownlint on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          npx markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }} \
            2>&1 | tee lint-output.txt || true

      - name: Check for broken links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --base ./build --max-retries 3 --retry-wait-time 5 ./build/**/*.html
          output: lychee-output.md
          fail: false

      - name: Post quality report as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-quality-report -->';

            // Lint results
            let lintOutput = '';
            try { lintOutput = fs.readFileSync('lint-output.txt', 'utf8').trim(); } catch(e) {}
            const hasLintErrors = lintOutput.includes('Error:');
            const lintSection = hasLintErrors
              ? `⚠️ **Markdown lint warnings**\n\`\`\`\n${lintOutput}\n\`\`\``
              : `✅ **Markdown lint passed**`;

            // Internal broken links from Docusaurus build warnings
            let internalLinkLines = [];
            try {
              const buildOutput = fs.readFileSync('build/build-output.txt', 'utf8');
              internalLinkLines = buildOutput.split('\n').filter(l =>
                l.includes('broken link') || l.includes('broken anchor') || l.includes('broken markdown link')
              );
            } catch(e) {}
            const internalLinkSection = internalLinkLines.length > 0
              ? `⚠️ **Broken internal links found**\n\`\`\`\n${internalLinkLines.join('\n')}\n\`\`\``
              : `✅ **No broken internal links**`;

            // External broken links from lychee
            let linkOutput = '';
            try { linkOutput = fs.readFileSync('lychee-output.md', 'utf8').trim(); } catch(e) {}
            const hasLinkErrors = linkOutput.includes('Error') || linkOutput.includes('Failed');
            const externalLinkSection = hasLinkErrors
              ? `⚠️ **Broken external links found**\n\n${linkOutput}`
              : `✅ **No broken external links**`;

            const body = `${marker}\n## Docs Quality Report\n\n${lintSection}\n\n---\n\n${internalLinkSection}\n\n---\n\n${externalLinkSection}\n\n> Pipeline not blocked — please review before merging.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: build/

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Serve built site
        run: npx serve build -l 3000 &

      - name: Wait for server
        run: sleep 5

      - name: Run pa11y accessibility checks
        run: |
          pa11y-ci \
          --config .pa11yci.json \
            http://localhost:3000/docs/getting-started/introduction \
            http://localhost:3000/docs/api-reference/overview \
            http://localhost:3000/docs/sdk/overview \
            --reporter json > pa11y-report.json
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-report
          path: pa11y-report.json

      - name: Post accessibility report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- accessibility-report -->';

            let commentBody = '';
            try {
              const report = JSON.parse(fs.readFileSync('pa11y-report.json', 'utf8').trim());
              const total = report.total ?? 0;
              const passes = report.passes ?? 0;
              const errors = report.errors ?? 0;

              if (errors > 0) {
                const issueLines = [];
                for (const [url, issues] of Object.entries(report.results || {})) {
                  if (issues && issues.length > 0) {
                    issueLines.push(`**${url}** — ${issues.length} issue(s)`);
                    issues.slice(0, 5).forEach(i => issueLines.push(`  - \`${i.code}\`: ${i.message}`));
                    if (issues.length > 5) issueLines.push(`  - ...and ${issues.length - 5} more`);
                  }
                }
                commentBody = `## Accessibility Report\n\n⚠️ **${errors} issue(s) found** (${passes}/${total} pages passed)\n\n${issueLines.join('\n')}`;
              } else {
                commentBody = `## Accessibility Report\n\n✅ **All ${total} page(s) passed accessibility checks**`;
              }
            } catch(e) {
              commentBody = `## Accessibility Report\n\n⚠️ **Could not parse accessibility report** — check the uploaded artifact for details.`;
            }

            const body = `${marker}\n${commentBody}\n\n> Pipeline not blocked — please review before merging.`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }