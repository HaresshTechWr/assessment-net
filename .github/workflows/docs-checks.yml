name: Docs Quality Checks

on:
  pull_request:
    branches:
      - main

jobs:
  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

  lint-markdown:
    name: Markdown Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: "docs/**/*.md"

      - name: Run markdownlint
        if: steps.changed-files.outputs.any_changed == 'true'
        id: lint
        continue-on-error: true
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Comment lint failures on PR
        if: steps.lint.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Markdown lint failed** on one or more changed files. Please fix formatting errors before merging.\n\nCheck the [Actions log](' + context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo + '/actions/runs/' + context.runId + ') for the exact lines and rules violated.'
            })

      - name: Fail job if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1

  check-links:
    name: Broken Link Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v1
        with:
          args: --base ./build --offline ./build/**/*.html
          fail: true

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Serve built site
        run: npx serve build -l 3000 &

      - name: Wait for server
        run: sleep 5

      - name: Run pa11y accessibility checks
        run: |
          pa11y-ci \
            http://localhost:3000/docs/getting-started/introduction \
            http://localhost:3000/docs/api-reference/overview \
            http://localhost:3000/docs/sdk/overview \
            --reporter json > pa11y-report.json
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-report
          path: pa11y-report.json