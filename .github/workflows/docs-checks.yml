name: Docs Quality Checks

on:
  pull_request:
    branches:
      - main

permissions:
  pull-requests: write

jobs:
  build-check:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: |
          set -o pipefail
          npm run build 2>&1 | tee build-output.txt
          mv build-output.txt build/build-output.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: docusaurus-build
          path: build/
          retention-days: 1

  docs-quality:
    name: Docs Quality
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: build/

      - name: Get changed markdown files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            docs/**/*.md
            docs/**/*.mdx

      - name: Run markdownlint on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        continue-on-error: true
        run: |
          npx markdownlint-cli2 ${{ steps.changed-files.outputs.all_changed_files }} \
            2>&1 | tee lint-output.txt || true

      - name: Check for broken links
        continue-on-error: true
        uses: lycheeverse/lychee-action@v1
        with:
          args: --base ./build --max-retries 3 --retry-wait-time 5 ./build/**/*.html
          output: lychee-output.md
          fail: false

      - name: Post quality report as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- docs-quality-report -->';

            // ── Markdown lint ──────────────────────────────────────────────
            let lintOutput = '';
            try { lintOutput = fs.readFileSync('lint-output.txt', 'utf8').trim(); } catch(e) {}
            const hasLintErrors = lintOutput.includes('Error:');

            // ── Internal broken links ──────────────────────────────────────
            let mdWarnings = [];
            let brokenPages = [];
            try {
              const buildOutput = fs.readFileSync('build/build-output.txt', 'utf8');
              buildOutput.split('\n').forEach(line => {
                const m = line.match(/URL `([^`]+)` in source file "([^"]+)" \((\d+):\d+\)/);
                if (m) mdWarnings.push({ url: m[1], file: m[2], line: m[3] });
              });
              const start = buildOutput.indexOf('Exhaustive list of all broken links found:');
              if (start !== -1) {
                let currentPage = null;
                buildOutput.slice(start).split('\n').forEach(line => {
                  const pageM = line.match(/Broken link on source page path = (.+):/);
                  const linkM = line.match(/-> linking to (.+?)(?:\s+\(resolved as:.*\))?$/);
                  if (pageM) currentPage = pageM[1];
                  else if (linkM && currentPage) brokenPages.push({ page: currentPage.trim(), link: linkM[1].trim() });
                });
              }
            } catch(e) {}
            const hasInternalIssues = mdWarnings.length > 0 || brokenPages.length > 0;

            // ── External broken links ──────────────────────────────────────
            let linkOutput = '';
            try { linkOutput = fs.readFileSync('lychee-output.md', 'utf8').trim(); } catch(e) {}
            const hasLinkErrors = linkOutput.includes('Error') || linkOutput.includes('Failed');

            // ── Summary table ──────────────────────────────────────────────
            const lintStatus     = hasLintErrors     ? '⚠️ Issues found' : '✅ Passed';
            const internalStatus = hasInternalIssues ? `⚠️ ${mdWarnings.length} in source files` : '✅ Clean';
            const externalStatus = hasLinkErrors     ? '⚠️ Errors found' : '✅ Clean';

            const summaryTable = [
              '| Check | Status |',
              '|---|---|',
              `| Markdown lint | ${lintStatus} |`,
              `| Internal links | ${internalStatus} |`,
              `| External links | ${externalStatus} |`,
            ].join('\n');

            // ── Section builders ───────────────────────────────────────────
            const lintSection = hasLintErrors
              ? `### Markdown Lint\n\n<details>\n<summary>⚠️ Lint issues found — click to expand</summary>\n\n\`\`\`\n${lintOutput}\n\`\`\`\n\n</details>`
              : `### Markdown Lint\n\n✅ No issues found.`;

            let internalSection;
            if (hasInternalIssues) {
              const parts = [];
              if (mdWarnings.length > 0) {
                const rows = mdWarnings.map(w => `| \`${w.file}:${w.line}\` | \`${w.url}\` |`).join('\n');
                parts.push(`| File | Broken link |\n|---|---|\n${rows}`);
              }
              if (brokenPages.length > 0) {
                const items = brokenPages.map(b => `- \`${b.page}\` → \`${b.link}\``).join('\n');
                parts.push(`<details>\n<summary>Affected pages (${brokenPages.length})</summary>\n\n${items}\n\n</details>`);
              }
              internalSection = `### Internal Links\n\n${parts.join('\n\n')}`;
            } else {
              internalSection = `### Internal Links\n\n✅ No broken internal links.`;
            }

            const externalSection = hasLinkErrors
              ? `### External Links\n\n<details>\n<summary>⚠️ Broken external links found — click to expand</summary>\n\n${linkOutput}\n\n</details>`
              : `### External Links\n\n✅ No broken external links.`;

            // ── Assemble body ──────────────────────────────────────────────
            const body = [
              marker,
              '## Docs Quality Report',
              '',
              summaryTable,
              '',
              '---',
              '',
              lintSection,
              '',
              '---',
              '',
              internalSection,
              '',
              '---',
              '',
              externalSection,
              '',
              '---',
              '',
              '> Pipeline not blocked — please review before merging.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
            }

  accessibility-check:
    name: Accessibility Check
    runs-on: ubuntu-latest
    needs: build-check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: docusaurus-build
          path: build/

      - name: Install pa11y-ci
        run: npm install -g pa11y-ci

      - name: Serve built site
        run: npx serve build -l 3000 &

      - name: Wait for server
        run: sleep 5

      - name: Run pa11y accessibility checks
        run: |
          pa11y-ci \
          --config .pa11yci.json \
            http://localhost:3000/docs/getting-started/introduction \
            http://localhost:3000/docs/api-reference/overview \
            http://localhost:3000/docs/sdk/overview \
            --reporter json > pa11y-report.json
        continue-on-error: true

      - name: Upload accessibility report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pa11y-report
          path: pa11y-report.json

      - name: Post accessibility report as PR comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- accessibility-report -->';

            let body = '';
            try {
              const report = JSON.parse(fs.readFileSync('pa11y-report.json', 'utf8').trim());
              const total   = report.total  ?? 0;
              const passes  = report.passes ?? 0;
              const errors  = report.errors ?? 0;
              const results = report.results || {};

              const overallStatus = errors > 0
                ? `⚠️ **${errors} issue(s) found** — ${passes} of ${total} page(s) passed`
                : `✅ **All ${total} page(s) passed**`;

              // Per-page summary table
              const pageRows = Object.entries(results).map(([url, issues]) => {
                const path = url.replace('http://localhost:3000', '');
                const count = issues ? issues.length : 0;
                return `| \`${path}\` | ${count > 0 ? `⚠️ ${count} issue(s)` : '✅ Pass'} |`;
              }).join('\n');
              const summaryTable = `| Page | Result |\n|---|---|\n${pageRows || '| — | — |'}`;

              // Collapsible issue details
              const detailLines = [];
              for (const [url, issues] of Object.entries(results)) {
                if (issues && issues.length > 0) {
                  const path = url.replace('http://localhost:3000', '');
                  detailLines.push(`**\`${path}\`**`);
                  issues.forEach(i => detailLines.push(`- \`${i.code}\`  \n  ${i.message}`));
                  detailLines.push('');
                }
              }
              const detailSection = detailLines.length > 0
                ? `\n<details>\n<summary>View issue details</summary>\n\n${detailLines.join('\n')}\n</details>`
                : '';

              body = [
                marker,
                '## Accessibility Report',
                '',
                overallStatus,
                '',
                summaryTable,
                detailSection,
                '',
                '---',
                '',
                '> Pipeline not blocked — please review before merging.',
              ].join('\n');
            } catch(e) {
              body = `${marker}\n## Accessibility Report\n\n⚠️ Could not parse accessibility report — check the uploaded artifact for details.\n\n> Pipeline not blocked — please review before merging.`;
            }

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ comment_id: existing.id, owner: context.repo.owner, repo: context.repo.repo, body });
            } else {
              await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body });
            }